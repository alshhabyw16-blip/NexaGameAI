name: Build NexaGameAI APK

on:
push:
branches: [ "**" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:  
  - name: 1. Setup Java 17 Development Kit  
    uses: actions/setup-java@v4  
    with:  
      java-version: '17'  
      distribution: 'temurin'  

  - name: 2. Setup Gradle Build Tool  
    uses: gradle/actions/setup-gradle@v3  
    with:  
      gradle-version: 7.5.1  

  - name: 3. Accept Android SDK Licenses  
    run: |  
      yes | sdkmanager --licenses || true  

  - name: 4. Generate Project Files  
    run: |  
      # إنشاء المجلدات الهيكلية للمشروع  
      mkdir -p app/src/main/java/com/nexa/gameai  
      mkdir -p app/src/main/res/layout  
      mkdir -p app/src/main/res/values  
      mkdir -p app/src/main/res/xml  

      # -------------------------------------------------------------------  
      # 1. settings.gradle  
      # -------------------------------------------------------------------  
      cat << 'EOF' > settings.gradle  
      rootProject.name = "NexaGameAI"  
      include ':app'  
      EOF  

      # -------------------------------------------------------------------  
      # 2. build.gradle (Root)  
      # -------------------------------------------------------------------  
      cat << 'EOF' > build.gradle  
      buildscript {  
          repositories {  
              google()  
              mavenCentral()  
          }  
          dependencies {  
              classpath 'com.android.tools.build:gradle:7.4.2'  
          }  
      }  
      allprojects {  
          repositories {  
              google()  
              mavenCentral()  
          }  
      }  
      EOF  

      # -------------------------------------------------------------------  
      # 3. app/build.gradle (Android 8.1 / API 27+)  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/build.gradle  
      apply plugin: 'com.android.application'  

      android {  
          namespace 'com.nexa.gameai'  
          compileSdk 33  

          defaultConfig {  
              applicationId "com.nexa.gameai"  
              minSdk 27  
              targetSdk 33  
              versionCode 1  
              versionName "1.0"  
          }  

          buildTypes {  
              release {  
                  minifyEnabled false  
              }  
              debug {  
                  minifyEnabled false  
              }  
          }  

          compileOptions {  
              sourceCompatibility JavaVersion.VERSION_11  
              targetCompatibility JavaVersion.VERSION_11  
          }  
      }  
      EOF  

      # -------------------------------------------------------------------  
      # 4. app/src/main/AndroidManifest.xml  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/AndroidManifest.xml  
      <?xml version="1.0" encoding="utf-8"?>  
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">  

          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />  
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />  

          <application  
              android:allowBackup="true"  
              android:icon="@android:drawable/sym_def_app_icon"  
              android:label="@string/app_name"  
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">  

              <activity  
                  android:name="com.nexa.gameai.MainActivity"  
                  android:exported="true">  
                  <intent-filter>  
                      <action android:name="android.intent.action.MAIN" />  
                      <category android:name="android.intent.category.LAUNCHER" />  
                  </intent-filter>  
              </activity>  

              <service  
                  android:name="com.nexa.gameai.OverlayService"  
                  android:exported="false" />  

              <service  
                  android:name="com.nexa.gameai.GameAccessibilityService"  
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"  
                  android:exported="true">  
                  <intent-filter>  
                      <action android:name="android.accessibilityservice.AccessibilityService" />  
                  </intent-filter>  
                  <meta-data  
                      android:name="android.accessibilityservice"  
                      android:resource="@xml/accessibility_config" />  
              </service>  
          </application>  
      </manifest>  
      EOF  

      # -------------------------------------------------------------------  
      # 5. app/src/main/res/values/strings.xml  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/res/values/strings.xml  
      <?xml version="1.0" encoding="utf-8"?>  
      <resources>  
          <string name="app_name">Nexa Game AI</string>  
          <string name="accessibility_desc">خدمة إمكانية الوصول لمحاكاة التفاعل والتنقل في Nexa Game AI</string>  
      </resources>  
      EOF  

      # -------------------------------------------------------------------  
      # 6. app/src/main/res/xml/accessibility_config.xml  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml  
      <?xml version="1.0" encoding="utf-8"?>  
      <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"  
          android:accessibilityFeedbackType="feedbackGeneric"  
          android:accessibilityFlags="flagDefault"  
          android:canPerformGestures="true"  
          android:canRetrieveWindowContent="true"  
          android:description="@string/accessibility_desc"  
          android:notificationTimeout="100" />  
      EOF  

      # -------------------------------------------------------------------  
      # 7. app/src/main/res/layout/activity_main.xml  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/res/layout/activity_main.xml  
      <?xml version="1.0" encoding="utf-8"?>  
      <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"  
          android:layout_width="match_parent"  
          android:layout_height="match_parent"  
          android:orientation="vertical"  
          android:gravity="center"  
          android:background="#10141D"  
          android:padding="20dp">  

          <TextView  
              android:layout_width="wrap_content"  
              android:layout_height="wrap_content"  
              android:text="Nexa Game AI"  
              android:textColor="#00FFCC"  
              android:textSize="26sp"  
              android:textStyle="bold" />  

          <TextView  
              android:layout_width="wrap_content"  
              android:layout_height="wrap_content"  
              android:text="المساعد التكتيكي الذكي للعبة Free Fire"  
              android:textColor="#8892B0"  
              android:textSize="13sp"  
              android:layout_marginTop="6dp" />  

          <Button  
              android:id="@+id/btn_overlay_perm"  
              android:layout_width="match_parent"  
              android:layout_height="50dp"  
              android:layout_marginTop="32dp"  
              android:background="#1F293D"  
              android:text="1. منح إذن النافذة العائمة"  
              android:textColor="#FFFFFF" />  

          <Button  
              android:id="@+id/btn_access_perm"  
              android:layout_width="match_parent"  
              android:layout_height="50dp"  
              android:layout_marginTop="12dp"  
              android:background="#1F293D"  
              android:text="2. منح إذن خدمة اللمس والمحاكاة"  
              android:textColor="#FFFFFF" />  

          <Button  
              android:id="@+id/btn_launch"  
              android:layout_width="match_parent"  
              android:layout_height="54dp"  
              android:layout_marginTop="24dp"  
              android:background="#00FFCC"  
              android:text="تشغيل المساعد فوق اللعبة 🎮"  
              android:textColor="#0A0E17"  
              android:textStyle="bold" />  
      </LinearLayout>  
      EOF  

      # -------------------------------------------------------------------  
      # 8. app/src/main/res/layout/layout_floating_panel.xml  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/res/layout/layout_floating_panel.xml  
      <?xml version="1.0" encoding="utf-8"?>  
      <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"  
          android:layout_width="230dp"  
          android:layout_height="wrap_content"  
          android:orientation="vertical"  
          android:background="#E60D1117"  
          android:padding="10dp">  

          <TextView  
              android:layout_width="match_parent"  
              android:layout_height="wrap_content"  
              android:text="🎮 Nexa Coach"  
              android:textColor="#00FFCC"  
              android:textStyle="bold"  
              android:gravity="center" />  

          <TextView  
              android:id="@+id/txt_tips"  
              android:layout_width="match_parent"  
              android:layout_height="wrap_content"  
              android:layout_marginTop="8dp"  
              android:background="#161B22"  
              android:padding="8dp"  
              android:text="اضغط 'بدء التحليل' لبدء التوجيه التكتيكي..."  
              android:textColor="#C9D1D9"  
              android:textSize="11sp" />  

          <LinearLayout  
              android:layout_width="match_parent"  
              android:layout_height="wrap_content"  
              android:orientation="horizontal"  
              android:layout_marginTop="8dp">  

              <Button  
                  android:id="@+id/btn_start_ai"  
                  android:layout_width="0dp"  
                  android:layout_height="38dp"  
                  android:layout_weight="1"  
                  android:background="#238636"  
                  android:text="بدء التحليل"  
                  android:textColor="#FFFFFF"  
                  android:textSize="10sp" />  

              <Button  
                  android:id="@+id/btn_stop_ai"  
                  android:layout_width="0dp"  
                  android:layout_height="38dp"  
                  android:layout_weight="1"  
                  android:layout_marginStart="4dp"  
                  android:background="#DA3633"  
                  android:text="إيقاف"  
                  android:textColor="#FFFFFF"  
                  android:textSize="10sp" />  
          </LinearLayout>  

          <Button  
              android:id="@+id/btn_auto_play"  
              android:layout_width="match_parent"  
              android:layout_height="38dp"  
              android:layout_marginTop="6dp"  
              android:background="#D29922"  
              android:text="تشغيل اللمس التلقائي ⚙️"  
              android:textColor="#FFFFFF"  
              android:textSize="10sp" />  

          <Button  
              android:id="@+id/btn_close"  
              android:layout_width="match_parent"  
              android:layout_height="30dp"  
              android:layout_marginTop="6dp"  
              android:background="#30363D"  
              android:text="إغلاق اللوحة"  
              android:textColor="#8B949E"  
              android:textSize="9sp" />  
      </LinearLayout>  
      EOF  

      # -------------------------------------------------------------------  
      # 9. MainActivity.java  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/java/com/nexa/gameai/MainActivity.java  
      package com.nexa.gameai;  

      import android.app.Activity;  
      import android.content.Intent;  
      import android.net.Uri;  
      import android.os.Build;  
      import android.os.Bundle;  
      import android.provider.Settings;  
      import android.widget.Button;  
      import android.widget.Toast;  

      public class MainActivity extends Activity {  

          @Override  
          protected void onCreate(Bundle savedInstanceState) {  
              super.onCreate(savedInstanceState);  
              setContentView(R.layout.activity_main);  

              Button btnOverlay = findViewById(R.id.btn_overlay_perm);  
              Button btnAccess = findViewById(R.id.btn_access_perm);  
              Button btnLaunch = findViewById(R.id.btn_launch);  

              btnOverlay.setOnClickListener(v -> {  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {  
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,  
                              Uri.parse("package:" + getPackageName()));  
                      startActivity(intent);  
                  } else {  
                      Toast.makeText(this, "إذن النافذة العائمة مفعل مسبقاً", Toast.LENGTH_SHORT).show();  
                  }  
              });  

              btnAccess.setOnClickListener(v -> {  
                  Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);  
                  startActivity(intent);  
              });  

              btnLaunch.setOnClickListener(v -> {  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {  
                      Toast.makeText(this, "يرجى منح إذن النافذة العائمة أولاً!", Toast.LENGTH_LONG).show();  
                      return;  
                  }  
                  startService(new Intent(this, OverlayService.class));  
                  finish();  
              });  
          }  
      }  
      EOF  

      # -------------------------------------------------------------------  
      # 10. GameAccessibilityService.java  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/java/com/nexa/gameai/GameAccessibilityService.java  
      package com.nexa.gameai;  

      import android.accessibilityservice.AccessibilityService;  
      import android.accessibilityservice.GestureDescription;  
      import android.graphics.Path;  
      import android.os.Handler;  
      import android.os.Looper;  
      import android.view.accessibility.AccessibilityEvent;  

      public class GameAccessibilityService extends AccessibilityService {  

          public static GameAccessibilityService instance;  
          private boolean isRunning = false;  
          private final Handler loopHandler = new Handler(Looper.getMainLooper());  
          private Runnable touchRunnable;  

          @Override  
          public void onServiceConnected() {  
              super.onServiceConnected();  
              instance = this;  
          }  

          @Override  
          public void onAccessibilityEvent(AccessibilityEvent event) {}  

          @Override  
          public void onInterrupt() {  
              stopAutoActions();  
          }  

          public void simulateTap(float x, float y) {  
              Path path = new Path();  
              path.moveTo(x, y);  
              GestureDescription.StrokeDescription stroke =  
                      new GestureDescription.StrokeDescription(path, 0, 50);  
              GestureDescription gesture = new GestureDescription.Builder().addStroke(stroke).build();  
              dispatchGesture(gesture, null, null);  
          }  

          public void startAutoActions() {  
              if (isRunning) return;  
              isRunning = true;  

              touchRunnable = new Runnable() {  
                  @Override  
                  public void run() {  
                      if (!isRunning) return;  
                      simulateTap(1700f, 700f);  
                      long delay = 500 + (long) (Math.random() * 250);  
                      loopHandler.postDelayed(this, delay);  
                  }  
              };  
              loopHandler.post(touchRunnable);  
          }  

          public void stopAutoActions() {  
              isRunning = false;  
              if (touchRunnable != null) {  
                  loopHandler.removeCallbacks(touchRunnable);  
              }  
          }  

          @Override  
          public void onDestroy() {  
              super.onDestroy();  
              stopAutoActions();  
              instance = null;  
          }  
      }  
      EOF  

      # -------------------------------------------------------------------  
      # 11. OverlayService.java  
      # -------------------------------------------------------------------  
      cat << 'EOF' > app/src/main/java/com/nexa/gameai/OverlayService.java  
      package com.nexa.gameai;  

      import android.app.Service;  
      import android.content.Intent;  
      import android.graphics.PixelFormat;  
      import android.os.Build;  
      import android.os.Handler;  
      import android.os.IBinder;  
      import android.os.Looper;  
      import android.view.Gravity;  
      import android.view.LayoutInflater;  
      import android.view.MotionEvent;  
      import android.view.View;  
      import android.view.WindowManager;  
      import android.widget.Button;  
      import android.widget.TextView;  

      public class OverlayService extends Service {  

          private WindowManager windowManager;  
          private View panelView;  
          private boolean isAnalyzing = false;  
          private boolean isAutoRunning = false;  
          private final Handler handler = new Handler(Looper.getMainLooper());  
          private Runnable adviceRunnable;  

          private final String[] tacticalAdvice = {  
              "تكتيك Zone: الزون تقترب، تحرك إلى الحافة المرتفعة فوراً.",  
              "تكتيك اشتباك: انشر جدار الجلو (Gloo Wall) لحماية مسارك.",  
              "تكتيك مراقبة: صندوق الإمداد مكشوف، افحص التلال قبل النهب.",  
              "تكتيك تموضع: حافظ على البقاء قرب مبنى ذي مخرجين للطوارئ.",  
              "تكتيك صحي: جدد نقاط EP والدم بالكامل قبل بدء المواجهة."  
          };  
          private int adviceIndex = 0;  

          @Override  
          public IBinder onBind(Intent intent) { return null; }  

          @Override  
          public void onCreate() {  
              super.onCreate();  

              windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);  
              panelView = LayoutInflater.from(this).inflate(R.layout.layout_floating_panel, null);  

              int overlayType = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ?  
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :  
                      WindowManager.LayoutParams.TYPE_PHONE;  

              WindowManager.LayoutParams params = new WindowManager.LayoutParams(  
                      WindowManager.LayoutParams.WRAP_CONTENT,  
                      WindowManager.LayoutParams.WRAP_CONTENT,  
                      overlayType,  
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,  
                      PixelFormat.TRANSLUCENT  
              );  

              params.gravity = Gravity.TOP | Gravity.START;  
              params.x = 60;  
              params.y = 150;  
              windowManager.addView(panelView, params);  

              TextView txtTips = panelView.findViewById(R.id.txt_tips);  
              Button btnStartAI = panelView.findViewById(R.id.btn_start_ai);  
              Button btnStopAI = panelView.findViewById(R.id.btn_stop_ai);  
              Button btnAutoPlay = panelView.findViewById(R.id.btn_auto_play);  
              Button btnClose = panelView.findViewById(R.id.btn_close);  

              btnStartAI.setOnClickListener(v -> {  
                  if (isAnalyzing) return;  
                  isAnalyzing = true;  
                  txtTips.setText("مساعد Free Fire: بدأ التوجيه التكتيكي...");  

                  adviceRunnable = new Runnable() {  
                      @Override  
                      public void run() {  
                          if (!isAnalyzing) return;  
                          txtTips.setText("💡 " + tacticalAdvice[adviceIndex % tacticalAdvice.length]);  
                          adviceIndex++;  
                          handler.postDelayed(this, 6000);  
                      }  
                  };  
                  handler.postDelayed(adviceRunnable, 1000);  
              });  

              btnStopAI.setOnClickListener(v -> {  
                  isAnalyzing = false;  
                  if (adviceRunnable != null) handler.removeCallbacks(adviceRunnable);  
                  txtTips.setText("تم إيقاف المساعد. التحكم يدوي بالكامل.");  
              });  

              btnAutoPlay.setOnClickListener(v -> {  
                  if (GameAccessibilityService.instance == null) {  
                      txtTips.setText("تنبيه: فعّل خدمة إمكانية الوصول من الإعدادات!");  
                      return;  
                  }  

                  if (!isAutoRunning) {  
                      isAutoRunning = true;  
                      btnAutoPlay.setText("إيقاف اللمس 🛑");  
                      btnAutoPlay.setBackgroundColor(0xFFDA3633);  
                      GameAccessibilityService.instance.startAutoActions();  
                  } else {  
                      isAutoRunning = false;  
                      btnAutoPlay.setText("تشغيل اللمس التلقائي ⚙️");  
                      btnAutoPlay.setBackgroundColor(0xFFD29922);  
                      GameAccessibilityService.instance.stopAutoActions();  
                  }  
              });  

              btnClose.setOnClickListener(v -> stopSelf());  
              enableDrag(params);  
          }  

          private void enableDrag(WindowManager.LayoutParams params) {  
              panelView.setOnTouchListener(new View.OnTouchListener() {  
                  private int initialX, initialY;  
                  private float touchX, touchY;  

                  @Override  
                  public boolean onTouch(View v, MotionEvent event) {  
                      switch (event.getAction()) {  
                          case MotionEvent.ACTION_DOWN:  
                              initialX = params.x;  
                              initialY = params.y;  
                              touchX = event.getRawX();  
                              touchY = event.getRawY();  
                              return true;  
                          case MotionEvent.ACTION_MOVE:  
                              params.x = initialX + (int) (event.getRawX() - touchX);  
                              params.y = initialY + (int) (event.getRawY() - touchY);  
                              windowManager.updateViewLayout(panelView, params);  
                              return true;  
                      }  
                      return false;  
                  }  
              });  
          }  

          @Override  
          public void onDestroy() {  
              super.onDestroy();  
              if (panelView != null) windowManager.removeView(panelView);  
          }  
      }  
      EOF  

  - name: 5. Verify Generated Files  
    run: |  
      ls -la app/src/main/AndroidManifest.xml  
      ls -la app/src/main/java/com/nexa/gameai/  
      ls -la app/src/main/res/layout/  

  - name: 6. Build Debug APK  
    run: gradle assembleDebug --stacktrace --no-daemon  

  - name: 7. Upload APK Artifact  
    uses: actions/upload-artifact@v4  
    with:  
      name: NexaGameAI-Debug-APK  
      path: app/build/outputs/apk/debug/app-debug.apk  
      if-no-files-found: error
